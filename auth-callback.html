<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Se conectează... — Moldova RP</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="auth.css"></head>
<body><div class="auth"><div class="brand"><img src="assets/logo.png" alt=""><b>MOLDOVA<span>RP</span></b></div><div class="box"><p>PORTAL OFICIAL</p><h1 id="title">Se conectează...</h1><p id="message" class="error" hidden></p></div></div>
<script src="auth-client.js"></script>
<script>
(async () => {
  const params = new URLSearchParams(window.location.search);
  const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  const error = params.get("error");
  const token = hashParams.get("token");

  const title = document.getElementById("title");
  const message = document.getElementById("message");

  if (error || !token) {
    title.textContent = "Autentificarea a eșuat";
    message.textContent = error === "discord_denied"
      ? "Ai anulat conectarea cu Discord."
      : "Nu am reușit să te conectăm cu Discord. Încearcă din nou.";
    message.hidden = false;
    setTimeout(() => { window.location.href = "login.html"; }, 2500);
    return;
  }

  try {
    setAuth(token, null);
    const res = await fetch("/api/me", { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) throw new Error();
    const me = await res.json();
    setAuth(token, { id: me.id, username: me.username, role: me.role });
    window.location.href = "dashboard.html";
  } catch {
    clearAuth();
    title.textContent = "Autentificarea a eșuat";
    message.textContent = "Contul a fost creat, dar ceva nu a mers bine la conectare. Încearcă din nou.";
    message.hidden = false;
    setTimeout(() => { window.location.href = "login.html"; }, 2500);
  }
})();
</script>
</body></html>
