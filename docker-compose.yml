services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moldova_rp
      POSTGRES_USER: moldova
      POSTGRES_PASSWORD: moldova_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moldova -d moldova_rp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://moldova:moldova_password@db:5432/moldova_rp
      JWT_SECRET: schimbati-in-productie
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - ./:/app
    command: sh -c "npm install --omit=dev && node backend/server.js"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
