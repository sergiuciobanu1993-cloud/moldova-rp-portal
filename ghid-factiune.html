  function slugify(s) {
    return s.toLowerCase()
      .replace(/ă/g, 'a').replace(/â/g, 'a').replace(/î/g, 'i').replace(/ș/g, 's').replace(/ț/g, 't')
      .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  (() => {
    const container = document.getElementById('guide-content');
    const slug = new URLSearchParams(window.location.search).get('slug');
    const g = GUIDES[slug];
    if (!g) {
      container.innerHTML = '<div class="empty-state">Această facțiune nu există în ghid.</div>';
      return;
    }
    document.title = `${g.title} — Ghid Facțiuni — Moldova RP`;

    const toc = g.sections.map(s => `<li><a class="text-link" href="#${slugify(s.h)}">${escapeHtml(s.h)}</a></li>`).join('');

    const sectionsHtml = g.sections.map(s => `
      <h2 id="${slugify(s.h)}">${escapeHtml(s.h)}</h2>
      ${(s.p || []).map(par => `<p>${escapeHtml(par)}</p>`).join('')}
      ${s.list ? `<ul>${s.list.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>` : ''}
    `).join('');

    container.innerHTML = `
      <article class="prose-box prose">
        <div class="prose-meta"><span class="tag">${escapeHtml(g.tag || 'GHID FACȚIUNI')}</span><span>·</span><span>Regulament oficial Moldova RP</span></div>
        <h1>${g.icon} ${escapeHtml(g.title)}</h1>
        <p class="muted" style="margin:-10px 0 22px">${escapeHtml(g.tagline)}</p>
        ${g.sections.length > 3 ? `<div style="background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-bottom:26px"><strong style="display:block;margin-bottom:8px;font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase">Cuprins</strong><ul style="margin:0;padding-left:18px;columns:2;gap:24px">${toc}</ul></div>` : ''}
        <div class="prose-body">${sectionsHtml}</div>
        ${g.apply ? `<a class="btn btn-primary" href="${DISCORD_APPLY}" target="_blank" rel="noopener noreferrer" style="margin-top:10px">${escapeHtml(g.apply)} →</a>` : ''}
      </article>`;
  })();
  </script>
</body>
</html>
