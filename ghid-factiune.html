  <script>
  // Conținutul complet (titlu/tagline/corp) vine acum din
  // /api/content/ghid-factiune — editabil direct din Admin → Conținut pagini
  // (vezi scripts/seed-content.js pentru valorile inițiale, identice cu ce
  // era înainte hardcodat aici). SLUG_GROUP de mai jos e doar metadată
  // STRUCTURALĂ (ce buton de "înapoi" se afișează, ce titlu de tab implicit)
  // — nu e conținut editorial, rămâne local.
  const DISCORD_APPLY = 'https://discord.com/channels/1423438217469759490/1474778076226519070';
  const SLUG_GROUP = {
    politie: 'factiune', smurd: 'factiune', armata: 'factiune',
    serif: 'factiune', fib: 'factiune', guvern: 'factiune', weazel: 'factiune', justitie: 'factiune',
    moto: 'legislatie', auto: 'legislatie', camion: 'legislatie', barca: 'legislatie', pilot: 'legislatie'
  };

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function slugify(s) {
    return s.toLowerCase()
      .replace(/ă/g, 'a').replace(/â/g, 'a').replace(/î/g, 'i').replace(/ș/g, 's').replace(/ț/g, 't')
      .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  (async () => {
    const container = document.getElementById('guide-content');
    const slug = new URLSearchParams(window.location.search).get('slug');
    const group = SLUG_GROUP[slug];
    if (!group) {
      container.innerHTML = '<div class="empty-state">Această facțiune nu există în ghid.</div>';
      return;
    }

    // fondatorii au aici scurtătura spre editorul acestui ghid (vezi app.js)
    if (window.mrpEditButton) window.mrpEditButton('ghid-factiune', slug);

    const backLink = document.getElementById('back-link');
    if (group === 'legislatie') {
      backLink.href = 'legislatie-rutiera.html';
      backLink.textContent = '← Toate categoriile';
    }

    let blocks;
    try {
      const res = await fetch('/api/content/ghid-factiune');
      if (!res.ok) throw new Error();
      blocks = await res.json();
    } catch {
      container.innerHTML = '<div class="empty-state">Nu am putut încărca conținutul. Încearcă din nou mai târziu.</div>';
      return;
    }

    const icon = blocks[`${slug}_icon`]?.content || '';
    const tag = blocks[`${slug}_tag`]?.content || (group === 'legislatie' ? 'LEGISLAȚIE RUTIERĂ' : 'GHID FACȚIUNI');
    const title = blocks[`${slug}_title`]?.content || '';
    const tagline = blocks[`${slug}_tagline`]?.content || '';
    // Corpul e HTML brut (editabil din admin ca atare) — construit inițial
    // din exact aceleași secțiuni/liste care înainte trăiau hardcodate aici.
    const body = blocks[`${slug}_body`]?.content || '';
    const applyLabel = blocks[`${slug}_apply`]?.content || '';

    if (!title) {
      container.innerHTML = '<div class="empty-state">Această facțiune nu există în ghid.</div>';
      return;
    }

    document.title = group === 'legislatie' ? `${title} — Legislație Rutieră — Moldova RP` : `${title} — Ghid Facțiuni — Moldova RP`;

    container.innerHTML = `
      <article class="prose-box prose">
        <div class="prose-meta"><span class="tag">${escapeHtml(tag)}</span><span>·</span><span>Regulament oficial Moldova RP</span></div>
        <h1>${escapeHtml(icon)} ${escapeHtml(title)}</h1>
        <p class="muted" style="margin:-10px 0 22px">${escapeHtml(tagline)}</p>
        <div id="prose-toc"></div>
        <div class="prose-body" id="prose-body">${body}</div>
        ${applyLabel ? `<a class="btn btn-primary" href="${DISCORD_APPLY}" target="_blank" rel="noopener noreferrer" style="margin-top:10px">${escapeHtml(applyLabel)} →</a>` : ''}
      </article>`;

    // Cuprinsul se reconstruiește din h2-urile chiar randate în corp — merge
    // identic indiferent dacă body a rămas neschimbat sau a fost rescris
    // integral din admin (mod HTML brut).
    const bodyEl = document.getElementById('prose-body');
    const headings = Array.from(bodyEl.querySelectorAll('h2'));
    const tocEl = document.getElementById('prose-toc');
    if (headings.length > 3) {
      const used = new Set();
      const toc = headings.map(h => {
        const base = slugify(h.textContent);
        let id = base, i = 2;
        while (used.has(id)) { id = `${base}-${i++}`; }
        used.add(id);
        h.id = id;
        return `<li><a class="text-link" href="#${id}">${escapeHtml(h.textContent)}</a></li>`;
      }).join('');
      tocEl.outerHTML = `<div style="background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-bottom:26px"><strong style="display:block;margin-bottom:8px;font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase">Cuprins</strong><ul style="margin:0;padding-left:18px;columns:2;gap:24px">${toc}</ul></div>`;
    } else {
      tocEl.remove();
    }
  })();
  </script>
