<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0b">
<title>Ești offline — Moldova RP</title>
<link rel="icon" href="/assets/favicon.png">
<style>
  :root{--bg:#090a0b;--text:#f5f2ee;--muted:#9ca1a8;--orange:#ff8a1f}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(255,138,31,.12),transparent 70%),var(--bg);color:var(--text);font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center}
  main{max-width:360px}
  img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 0 24px rgba(255,138,31,.35))}
  h1{margin:18px 0 8px;font-size:24px;letter-spacing:-.02em}
  p{margin:0 0 24px;color:var(--muted)}
  button{min-height:48px;padding:0 24px;border:0;border-radius:12px;background:var(--orange);color:#0b0b0b;font:800 15px/1 inherit;font-family:inherit;cursor:pointer}
  button:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/assets/logo.png" alt="Moldova RP">
  <h1>Ești offline</h1>
  <p>Nu avem internet acum. Când revine conexiunea, apasă mai jos și te întorci exact unde erai.</p>
  <button type="button" onclick="location.reload()">Încearcă din nou</button>
</main>
<script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
