<body><div class="auth"><div class="brand"><img src="assets/logo.png" alt=""><b>MOLDOVA<span>RP</span></b></div><div class="box"><p>PORTAL OFICIAL</p><h1>Creează cont</h1><form id="register-form" novalidate><label>Username</label><input id="username-input" name="username" placeholder="username" autocomplete="username" required minlength="3"><label>Email</label><input id="email-input" name="email" type="email" placeholder="tu@exemplu.com" autocomplete="email" required><label>Parolă</label><input id="password-input" name="password" type="password" placeholder="minim 8 caractere" autocomplete="new-password" required minlength="8"><label>Confirmă parola</label><input id="password2-input" name="password2" type="password" placeholder="••••••••" autocomplete="new-password" required minlength="8"><label>Cod referal (opțional)</label><input id="referral-input" name="referral" placeholder="ex: CULIOK"><p id="register-error" class="error" hidden></p><p id="register-success" class="error" style="color:var(--green,#2e9e5b)" hidden></p><button type="submit" id="register-submit">Creează cont</button></form><div class="or"><span>sau</span></div><a class="discord" href="/api/auth/discord" id="discord-link">Conectare cu Discord</a><small>Contul creat aici funcționează cu email/username + parolă din prima — cel mai sigur mod de a avea un cont de staff, pentru că nu depinde deloc de Discord.</small></div><a href="login.html">← Am deja cont, intru</a></div>
<script src="auth-client.js"></script>
<script>
const form = document.getElementById('register-form');
const errorBox = document.getElementById('register-error');
const successBox = document.getElementById('register-success');
const submitBtn = document.getElementById('register-submit');
const referralInput = document.getElementById('referral-input');
const discordLink = document.getElementById('discord-link');

// Cod de referal (27.09.2026) — un streamer/partener trimite un link de
// forma register.html?ref=CULIOK; îl pre-completăm aici (dar rămâne
// editabil manual) și îl propagăm și la butonul de Discord, ca legătura să
// se stabilească indiferent pe care din cele două căi își face cineva
// contul. Vezi /api/auth/register și /api/auth/discord în backend.
const refFromUrl = new URLSearchParams(window.location.search).get('ref');
if (refFromUrl) referralInput.value = refFromUrl;

function updateDiscordLink() {
  const code = referralInput.value.trim();
  discordLink.href = code ? `/api/auth/discord?ref=${encodeURIComponent(code)}` : '/api/auth/discord';
}
updateDiscordLink();
referralInput.addEventListener('input', updateDiscordLink);

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.hidden = true;
  successBox.hidden = true;

  const username = document.getElementById('username-input').value.trim();
  const email = document.getElementById('email-input').value.trim();
  const password = document.getElementById('password-input').value;
  const password2 = document.getElementById('password2-input').value;
  const referralCode = referralInput.value.trim();

  if (password !== password2) {
    errorBox.textContent = 'Parolele nu coincid.';
    errorBox.hidden = false;
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Se creează…';
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password, referralCode })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Nu am putut crea contul.');

    // Contul e creat cu rang de jucător (implicit, din backend) — dacă
    // trebuie să devină admin/staff, un fondator îi schimbă rangul din
    // admin-utilizatori.html DUPĂ ce contul există. Nu autentificăm automat
    // aici — îl trimitem la login, ca să confirme că parola chiar merge.
    successBox.textContent = 'Cont creat! Te poți autentifica acum cu username/email și parola ta.';
    successBox.hidden = false;
    form.reset();
    if (refFromUrl) referralInput.value = refFromUrl;
    updateDiscordLink();
  } catch (err) {
    errorBox.textContent = err.message || 'Nu ne-am putut conecta la server.';
    errorBox.hidden = false;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Creează cont';
  }
});
</script>
