  <script>
  // Minimal, dependency-free markdown renderer for regulation content written
  // in the admin CMS textarea. Covers headings, **bold**, *italic*, > quotes,
  // --- rules and * / - lists — enough for the regulation documents admins
  // write, without pulling in an external markdown library. Escapes HTML
  // first so admin-authored content can't inject markup.
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function inlineMd(s) {
    return s
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, '$1<em>$2</em>');
  }
  function mdToHtml(md) {
    const lines = escapeHtml(md).replace(/\r\n/g, '\n').split('\n');
    let html = '', inList = false, inQuote = false;
    const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
    const closeQuote = () => { if (inQuote) { html += '</blockquote>'; inQuote = false; } };
    for (const raw of lines) {
      const line = raw.trimEnd();
      if (/^\s*$/.test(line)) { closeList(); closeQuote(); continue; }
      if (/^-{3,}$/.test(line.trim())) { closeList(); closeQuote(); html += '<hr>'; continue; }
      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        closeList(); closeQuote();
        const level = Math.min(h[1].length + 1, 6);
        html += `<h${level}>${inlineMd(h[2])}</h${level}>`;
        continue;
      }
      if (/^&gt;\s?/.test(line)) {
        if (!inQuote) { html += '<blockquote>'; inQuote = true; }
        html += `<p>${inlineMd(line.replace(/^&gt;\s?/, ''))}</p>`;
        continue;
      }
      if (/^[*-]\s+/.test(line)) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += `<li>${inlineMd(line.replace(/^[*-]\s+/, ''))}</li>`;
        continue;
      }
      closeList(); closeQuote();
      html += `<p>${inlineMd(line)}</p>`;
    }
    closeList(); closeQuote();
    return html;
  }

  // Some regulations were pasted directly as rich-text HTML (from a WYSIWYG
  // editor — tables, styled headings, embedded iframes) rather than typed as
  // Markdown in the CMS textarea. Running that through the Markdown renderer
  // escapes every tag and shows literal "<h1>", "<table>", etc. instead of
  // real formatting, and silently swallows embedded content like a map
  // iframe. Detect which kind of content this is and render accordingly.
  function looksLikeHtml(s) {
    return /^\s*<[a-z][\s\S]*>/i.test(s.trim());
  }


  // (08.11.2026) Link la fiecare regulă. Regulile numerotate („1.3”, „2.10”) primesc id „r-1.3” și un „#” în față:
  // un clic copiază linkul (de dat în tichete sau pe Discord). Răspunsul rapid din Regulamente trimite aici cu
  // „#q=<începutul regulii>”: găsim regula, o aducem în ecran și o evidențiem câteva secunde.
  function linkRules(root) {
    if (!root) return;
    const norm = t => ' ' + String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
    const blocks = [...root.querySelectorAll('p, li, h2, h3, h4, h5, h6, td')];
    const used = new Map();
    for (const b of blocks) {
      const m = b.textContent.match(/^\s*(\d+(?:\.\d+)+)\.?\s/);
      if (!m || b.id) continue;
      const n = (used.get(m[1]) || 0) + 1; used.set(m[1], n);
      b.id = 'r-' + m[1] + (n > 1 ? '-' + n : '');
      const a = document.createElement('a');
      a.className = 'rl'; a.href = '#' + b.id; a.textContent = '#';
      a.setAttribute('aria-label', 'Copiază linkul la regula ' + m[1]);
      a.addEventListener('click', e => {
        e.preventDefault();
        history.replaceState(null, '', '#' + b.id);
        const done = () => { a.classList.add('ok'); setTimeout(() => a.classList.remove('ok'), 1600); };
        if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done, done); else done();
      });
      b.prepend(a);
    }
    let target = null;
    const h = decodeURIComponent(location.hash.slice(1));
    if (h.startsWith('q=')) {
      const q = norm(h.slice(2));
      const tries = [q, ' ' + q.trim().split(' ').slice(0, 5).join(' ') + ' '];
      for (const t of tries) { if (t.trim().length < 3) continue; target = blocks.find(b => norm(b.textContent.replace(/^#/, '')).includes(t)); if (target) break; }
    } else if (h.startsWith('r-')) target = document.getElementById(h);
    if (target) {
      target.classList.add('rg-hl');
      // sancțiunea scrisă pe rândul de dedesubt („⚖️ …”) o evidențiem și pe ea
      const nx = target.nextElementSibling;
      if (nx && /^\s*⚖/.test(nx.textContent)) nx.classList.add('rg-hl');
      requestAnimationFrame(() => target.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }));
    }
  }

  (async () => {
    const container = document.getElementById('reg-content');
    const slug = new URLSearchParams(window.location.search).get('slug');
    if (!slug) {
      container.innerHTML = '<div class="empty-state">Regulament negăsit.</div>';
      return;
    }
    try {
      const res = await fetch(`/api/regulations/${encodeURIComponent(slug)}`);
      if (!res.ok) throw new Error();
      const r = await res.json();
      document.title = `${r.title} — Moldova RP`;
      const body = looksLikeHtml(r.content) ? r.content : mdToHtml(r.content);
      container.innerHTML = `
        <article class="prose-box prose">
          <div class="prose-meta"><span class="tag">${r.category}</span><span>·</span><span>Versiune ${r.version}</span><span>·</span><span>Actualizat ${new Date(r.updated_at).toLocaleDateString('ro-RO')}</span></div>
          <h1>${r.title}</h1>
          ${slug === 'sanctiuni-oficiale' ? '<p style="margin:0 0 20px"><a href="calculator-sanctiuni.html" style="display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:12px;background:var(--orange);color:#0b0b0b;font-weight:900;text-decoration:none">🧮 Calculator de sancțiuni: caută abaterea și adună minutele</a></p>' : ''}
          <div class="prose-body">${body}</div>
        </article>`;
      linkRules(container.querySelector('.prose-body'));
    } catch {
      container.innerHTML = '<div class="empty-state">Acest regulament nu există sau nu a fost publicat.</div>';
    }
  })();
  </script>
