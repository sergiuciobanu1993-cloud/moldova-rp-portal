<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Overlay — Studio Moldova RP</title>
<!-- (03.11.2026) Overlay-urile Studio-ului de streaming: se pun în TikTok LIVE Studio („Link") sau OBS („Browser").
     ?k=CHEIA (din Studio) &w=alerts|chat|goal|top|counter|wheel|timer|fireworks|points|rotator|viewers|feed|auction|last…
     &id=g1 (la goal) · &tts=1 (alertele citite cu voce) · &demo=1 (evenimente de probă, fără live) -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@500;700;900&family=Press+Start+2P&display=swap">
<style>
:root{--accent:#ff8a1f;--ink:#fff;--sub:rgba(255,255,255,.72);--panel:rgba(12,14,20,.78);--edge:rgba(255,255,255,.12);--font:'Chakra Petch','Inter',system-ui,sans-serif;--r:16px}
html,body{margin:0;background:transparent!important;color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
body.t-glass{--panel:rgba(255,255,255,.16);--edge:rgba(255,255,255,.35);--font:'Inter',system-ui,sans-serif}
body.t-minimal{--panel:transparent;--edge:transparent;--font:'Inter',system-ui,sans-serif}
body.t-arcade{--panel:#14102a;--edge:var(--accent);--font:'Press Start 2P',monospace;--r:0}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);box-shadow:0 0 0 1px rgba(0,0,0,.25),0 0 24px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
body.t-glass .card{backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 10px 30px rgba(0,0,0,.25)}
body.t-glass *{text-shadow:0 1px 3px rgba(0,0,0,.55)}
body.t-minimal .card{box-shadow:none}
body.t-minimal *{text-shadow:0 2px 3px rgba(0,0,0,.85),0 0 1px #000}
body.t-arcade .card{border-width:3px;box-shadow:6px 6px 0 #000}
body.t-arcade{font-size:12px}
#root{position:fixed;left:0;top:0;width:100%;height:100%;transform-origin:0 0}
.hide{display:none!important}
.ttl{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--accent);margin:0 0 8px}
body.t-arcade .ttl{font-size:10px;line-height:1.6}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:color-mix(in srgb,var(--accent) 35%,#222);display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;overflow:hidden}
body.t-arcade .av{border-radius:0}
.num{font-variant-numeric:tabular-nums}

/* alerte */
#alerts{position:fixed;left:50%;top:24px;transform:translateX(-50%);width:min(760px,94vw)}
.al{display:flex;align-items:center;gap:18px;padding:18px 22px;animation:alIn .55s cubic-bezier(.2,1.4,.4,1) both}
.al.out{animation:alOut .45s ease-in both}
.al .pic{width:84px;height:84px;flex:none;display:grid;place-items:center;font-size:52px;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--accent) 70%,transparent))}
.al .pic img{width:84px;height:84px;object-fit:contain}
.al .pic img.round{border-radius:50%;object-fit:cover}
.al .tx{font-size:26px;font-weight:700;line-height:1.2}
.al .tx b{color:var(--accent)}
.al .kind{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);margin-bottom:4px}
body.t-arcade .al .tx{font-size:15px;line-height:1.6}
@keyframes alIn{from{opacity:0;transform:translateY(-30px) scale(.85)}to{opacity:1;transform:none}}
@keyframes alOut{to{opacity:0;transform:translateY(-20px) scale(.95)}}

/* chat */
#chat{position:fixed;left:0;bottom:0;width:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:10px;box-sizing:border-box}
.msg{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;animation:msgIn .35s ease-out both;transition:opacity 1s}
.msg .av{width:30px;height:30px;font-size:13px}
.msg b{color:var(--accent);margin-right:6px}
.msg .gi{width:22px;height:22px;vertical-align:-5px;margin:0 2px}
.msg.gift{border-color:var(--accent)}
.msg.fade{opacity:0}
body.t-arcade .msg{font-size:10px;line-height:1.7}
@keyframes msgIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}

/* obiectiv */
#goal{padding:14px 18px;margin:8px}
.bar{position:relative;height:30px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
body.t-arcade .bar{border-radius:0}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,#fff0),var(--accent));transition:width .8s cubic-bezier(.2,.9,.3,1);box-shadow:0 0 18px var(--accent)}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:15px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#goal.done .bar i{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.5)}}
/* (04.11.2026) stilurile obiectivelor: subțire, inel, cifră mare */
#goal.s-slim{padding:10px 14px}
#goal.s-slim .bar{height:10px}
#goal.s-slim .bar span{display:none}
#goal .sub{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;margin-top:6px}
#goal .sub i{font-style:normal;color:var(--sub)}
#goal.s-ring{display:flex;align-items:center;gap:16px;padding:12px 18px}
#goal .ring{position:relative;width:96px;height:96px;flex:none}
#goal .ring svg{width:96px;height:96px;transform:rotate(-90deg)}
#goal .ring circle{fill:none;stroke-width:10}
#goal .ring .bg{stroke:rgba(255,255,255,.14)}
#goal .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.9,.3,1);filter:drop-shadow(0 0 6px var(--accent))}
#goal .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
#goal.s-ring .ttl{margin:0 0 4px}
#goal.s-ring .val{font-size:22px;font-weight:700}
#goal.s-big{text-align:center;padding:14px 22px}
#goal.s-big .val{font-size:52px;font-weight:700;line-height:1.05}
#goal.s-big .val small{font-size:22px;color:var(--sub)}
#goal.s-big .bar{height:8px;margin-top:8px}
#goal.s-big .bar span{display:none}
#goal.hitfx{animation:alIn .6s both}
/* flux de cadouri */
#feed{margin:8px;padding:12px 14px;display:grid;gap:6px}
#feed .fr{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:calc(var(--r) * .5);background:rgba(255,255,255,.05)}
#feed .fr.new{animation:msgIn .45s ease-out both;background:color-mix(in srgb,var(--accent) 22%,transparent)}
#feed .fr .av{width:32px;height:32px;font-size:13px}
#feed .fr .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
#feed .fr .gi{width:30px;height:30px;object-fit:contain}
#feed .fr .x{font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
/* licitația */
#auc{margin:8px;padding:14px 16px}
#auc .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#auc .item{font-size:20px;font-weight:700;margin:2px 0 10px}
#auc .clock{font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
#auc .clock.hot{color:#ff5a4e;animation:pulse .8s infinite}
#auc .lead{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:calc(var(--r) * .6);background:color-mix(in srgb,var(--accent) 24%,transparent);border:2px solid color-mix(in srgb,var(--accent) 70%,transparent)}
#auc .lead.bump{animation:alIn .5s both}
#auc .lead b{font-size:20px;display:block}
#auc .lead .v{margin-left:auto;font-size:26px;font-weight:900}
#auc .rows .row .v{font-size:15px}
#auc .how{margin-top:8px;color:var(--sub);font-size:12.5px;text-align:center}
#auc .win{text-align:center;font-size:24px;font-weight:700;margin-top:10px;animation:alIn .6s both}
#timer.over .clock{color:#ff5a4e}

/* liste: top, puncte */
.list{padding:14px 16px;margin:8px}
.row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.08)}
.row:first-of-type{border-top:0}
.row .pos{width:26px;font-weight:900;color:var(--accent);text-align:center}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.row .v{font-weight:900}
.row .av{width:34px;height:34px;font-size:14px}
.empty{color:var(--sub);font-size:13px;padding:6px 0}

/* contor, spectatori */
.stats{display:flex;gap:22px;padding:14px 20px;margin:8px;align-items:center}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat small{color:var(--sub);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
body.t-arcade .stat b{font-size:18px}

/* cronometru */
#timer{padding:16px 22px;margin:8px;text-align:center;position:relative}
#timer .clock{font-size:64px;font-weight:700;letter-spacing:.04em;line-height:1}
body.t-arcade #timer .clock{font-size:36px}
#timer.paused .clock{opacity:.55}
.plus{position:absolute;right:18px;top:10px;font-weight:900;color:var(--accent);font-size:22px;animation:plus 1.6s ease-out forwards}
@keyframes plus{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-34px)}}

/* roata */
#wheel{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px}
#wheel .wrap{position:relative}
#wheel canvas{display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
#wheel .ptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--accent);filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
#wheel .res{padding:10px 18px;font-size:22px;font-weight:700;text-align:center;max-width:90%}
#wheel .res b{color:var(--accent)}
#wheel .q{color:var(--sub);font-size:13px}

/* rotator */
#rotator{padding:14px 22px;margin:8px;font-size:24px;font-weight:700;text-align:center;transition:opacity .5s}
#rotator.fade{opacity:0}

/* artificii */
#fw{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}

/* acțiuni (clipurile/imaginile/muzica alese de streamer) */
#act{position:fixed;inset:0;pointer-events:none}
.stage{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;animation:stIn .45s cubic-bezier(.2,1.3,.4,1) both;max-width:96vw}
.stage.out{animation:stOut .4s ease-in both}
.stage.p-center{left:50%;top:50%;transform:translate(-50%,-50%)}
.stage.p-top{left:50%;top:3vh;transform:translateX(-50%)}
.stage.p-bottom{left:50%;bottom:3vh;transform:translateX(-50%)}
.stage.p-left{left:3vw;top:50%;transform:translateY(-50%)}
.stage.p-right{right:3vw;top:50%;transform:translateY(-50%)}
.stage .md{display:block;max-height:72vh;object-fit:contain;border-radius:calc(var(--r) * .6)}
.stage .cap{font-size:clamp(20px,3.2vw,46px);font-weight:700;text-align:center;line-height:1.2;padding:10px 20px;max-width:90vw}
.stage .cap b{color:var(--accent)}
body.t-arcade .stage .cap{font-size:clamp(14px,2vw,26px);line-height:1.6}
@keyframes stIn{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
@keyframes stOut{to{opacity:0;scale:.9}}
.shake{animation:shk .5s linear 3}
@keyframes shk{0%,100%{translate:0 0}20%{translate:-14px 6px}40%{translate:12px -8px}60%{translate:-10px -4px}80%{translate:8px 8px}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:fl .7s ease-out}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:1}
/* canvas pe tot overlay-ul (borcan, fântână, tun) */
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.jar-hd{position:fixed;left:0;right:0;top:6px;text-align:center;z-index:2}
.jar-hd .ttl{margin:0}
.jar-hd b{font-size:15px}
/* bătălia echipelor */
#bt{margin:8px;padding:14px 16px}
#bt .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
#bt .clock{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
#bt .teams{display:grid;gap:10px}
#bt .tm{position:relative;padding:10px 12px;border-radius:calc(var(--r) * .6);background:color-mix(in srgb,var(--tc) 22%,transparent);border:2px solid color-mix(in srgb,var(--tc) 70%,transparent);transition:transform .25s}
#bt .tm.hit{transform:scale(1.04)}
#bt .tm b{display:block;font-size:17px}
#bt .tm .sc{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
#bt .tm small{color:var(--sub);font-size:12px}
#bt .tm .pl{position:absolute;right:10px;top:6px;font-weight:900;color:#fff;animation:plus 1.4s ease-out forwards}
#bt .rope{display:flex;height:16px;border-radius:99px;overflow:hidden;margin-top:12px;background:rgba(255,255,255,.1)}
#bt .rope i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.9,.3,1)}
#bt .win{margin-top:12px;text-align:center;font-size:24px;font-weight:700;animation:alIn .6s both}
#bt .how{margin-top:10px;color:var(--sub);font-size:12.5px;text-align:center}
body.t-arcade #bt .tm .sc{font-size:20px}
/* ultimii */
#last{display:flex;gap:10px;margin:8px}
#last.column{flex-direction:column}
#last .it{display:flex;align-items:center;gap:12px;padding:10px 14px;min-width:0;flex:1}
#last .it.new{animation:alIn .6s both}
#last .it .tx{min-width:0}
#last .it small{display:block;color:var(--accent);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
#last .it b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#last .it span{color:var(--sub);font-size:13px}
#last .gimg{width:22px;height:22px;vertical-align:-5px}
/* emoji din chat */
.emo{position:fixed;bottom:-80px;pointer-events:none;animation:emo 5s linear forwards;will-change:transform}
@keyframes emo{0%{transform:translate(0,0) scale(.6);opacity:0}8%{opacity:1;transform:translate(var(--dx1),-12vh) scale(1)}100%{transform:translate(var(--dx2),-115vh) scale(1.1);opacity:.9}}
#err{position:fixed;left:8px;bottom:8px;background:#300;color:#fbb;font:12px Inter,sans-serif;padding:6px 10px;border-radius:6px}
@media (prefers-reduced-motion:reduce){.al,.msg{animation:none}}
</style>
</head>
<body class="t-neon">
<div id="root"></div>
<canvas id="fw" class="hide"></canvas>
<div id="err" class="hide"></div>
<script src="stream-sounds.js"></script>
<script>
(() => {
  const P = new URLSearchParams(location.search);
  const KEY = P.get('k') || '', W = (P.get('w') || 'alerts').toLowerCase(), DEMO = P.get('demo') === '1';
  const root = document.getElementById('root');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => Number(n || 0).toLocaleString('ro-RO');
  const safeUrl = u => /^https:\/\//.test(u || '') ? u : '';
  const avatar = (u, cls = 'av') => safeUrl(u?.avatar) ? `<img class="${cls}" src="${esc(u.avatar)}" alt="" referrerpolicy="no-referrer">` : `<span class="${cls}">${esc((u?.name || '?').trim().charAt(0).toUpperCase() || '?')}</span>`;
  let S = null, ST = null, POINTS = [];

  // ----------------------------------------------------------- aspect
  function applyTheme() {
    if (!S) return;
    // (03.11.2026) fiecare overlay își poate avea stilul lui: &theme=glass&accent=ff3366 în link
    const th = ['neon', 'glass', 'minimal', 'arcade'].includes(P.get('theme')) ? P.get('theme') : S.theme?.style || 'neon';
    const ac = /^[0-9a-f]{6}$/i.test(P.get('accent') || '') ? '#' + P.get('accent') : S.theme?.accent || '#ff8a1f';
    document.body.className = 't-' + th;
    document.documentElement.style.setProperty('--accent', ac);
    const sc = Number(P.get('scale')) || S.theme?.scale || 1;
    root.style.transform = sc !== 1 ? `scale(${sc})` : '';
    root.style.width = root.style.height = sc !== 1 ? `${100 / sc}%` : '';
  }

  // sunetele alertelor: stream-sounds.js (aceleași și în Studio)
  const play = (name, vol) => window.MRPSound?.play(name, vol);

  // ----------------------------------------------------------- TTS (opțional, &tts=1)
  const TTS = P.get('tts') === '1' && 'speechSynthesis' in window;
  function say(text) {
    if (!TTS || !text) return;
    const u = new SpeechSynthesisUtterance(text), c = S?.tts || {};
    const vs = speechSynthesis.getVoices();
    u.voice = vs.find(v => v.name === c.voice) || vs.find(v => /^ro/i.test(v.lang)) || null;
    u.lang = u.voice?.lang || 'ro-RO'; u.rate = c.rate || 1; u.pitch = c.pitch || 1; u.volume = (c.volume ?? 80) / 100;
    speechSynthesis.speak(u);
  }

  // ----------------------------------------------------------- widgeturi
  const widgets = {};

  widgets.alerts = (() => {
    root.innerHTML = '<div id="alerts"></div>';
    const box = document.getElementById('alerts'), q = [];
    let busy = false;
    const KIND = { gift: 'Cadou', follow: 'Urmăritor nou', share: 'Distribuire', member: 'Bun venit', likes: 'Like-uri' };
    const PIC = { follow: '💖', share: '📣', member: '👋', likes: '❤️', gift: '🎁' };
    function next() {
      if (busy || !q.length) return;
      busy = true;
      const a = q.shift(), dur = (a.duration || 5) * 1000;
      const name = a.user ? esc(a.user) : '';
      let html = esc(a.text);
      if (name) html = html.split(name).join(`<b>${name}</b>`);
      const pic = a.kind === 'gift' && safeUrl(a.img) ? `<img src="${esc(a.img)}" alt="" referrerpolicy="no-referrer">`
        : (a.kind === 'follow' || a.kind === 'member') && safeUrl(a.avatar) ? `<img class="round" src="${esc(a.avatar)}" alt="" referrerpolicy="no-referrer">`
        : PIC[a.kind] || '✨';
      box.innerHTML = `<div class="al card"><div class="pic">${pic}</div><div class="tx"><span class="kind">${KIND[a.kind] || ''}</span>${html}</div></div>`;
      play(a.sound, a.volume);
      say(a.tts);
      setTimeout(() => { box.firstChild?.classList.add('out'); }, dur - 450);
      setTimeout(() => { box.innerHTML = ''; busy = false; setTimeout(next, 250); }, dur);
    }
    return {
      ev(e) {
        if (e.t === 'clear') { q.length = 0; return; }
        if (e.alert && q.length < 50) { q.push(e.alert); next(); }
      },
    };
  });

  widgets.chat = (() => {
    root.innerHTML = '<div id="chat"></div>';
    const box = document.getElementById('chat');
    function add(html, cls = '') {
      const c = S?.chat || {};
      const el = document.createElement('div');
      el.className = 'msg card ' + cls; el.innerHTML = html;
      box.appendChild(el);
      while (box.children.length > (c.max || 8)) box.firstChild.remove();
      if (c.fade) setTimeout(() => { el.classList.add('fade'); setTimeout(() => el.remove(), 1100); }, c.fade * 1000);
    }
    return {
      ev(e) {
        const c = S?.chat || {};
        if (e.t === 'chat') {
          if (c.hideCommands && /^\s*!/.test(e.text) && !/^\s*!(tts|spune|zi)\s/i.test(e.text)) return;
          add(`${avatar(e.user)}<div><b>${esc(e.user.name)}</b>${esc(e.text)}</div>`);
        } else if (e.t === 'gift' && c.showGifts) {
          add(`${avatar(e.user)}<div><b>${esc(e.user.name)}</b>a trimis ${e.count > 1 ? e.count + '× ' : ''}${safeUrl(e.img) ? `<img class="gi" src="${esc(e.img)}" alt="" referrerpolicy="no-referrer">` : '🎁'} ${esc(e.gift)}</div>`, 'gift');
        }
      },
    };
  });

  const GOAL_VAL = { likes: 'likes', diamonds: 'diamonds', follows: 'follows', shares: 'shares', gifts: 'gifts', subs: 'subs', viewers: 'viewers' };
  const GOAL_UNIT = { likes: '❤️', diamonds: '💎', follows: '👤', shares: '📣', gifts: '🎁', subs: '⭐', viewers: '👁', gift: '🎁', custom: '🎯' };
  widgets.goal = (() => {
    root.innerHTML = '<div id="goal" class="card"></div>';
    const el = document.getElementById('goal');
    let shape = '';
    function draw() {
      const goals = S?.goals || [];
      const g = goals.find(x => x.id === P.get('id')) || goals[Number(P.get('i')) || 0];
      if (!g) { el.classList.add('hide'); return; }
      el.classList.remove('hide');
      const style = ['bar', 'slim', 'ring', 'big'].includes(P.get('style')) ? P.get('style') : g.style || 'bar';
      // (04.11.2026) valoarea vine gata calculată de server (cu „reia" și contoarele pe cadou)

  // ---- borcanul cu cadouri: cadourile cad și se adună într-un borcan, butoi sau ulcior
  widgets.jar = (() => {
    root.innerHTML = '<div class="jar-hd"><p class="ttl"></p><b class="num"></b></div>';
    const { cv, cx } = fullCanvas();
    let bodies = [], shapeName = '', total = 0;
    const d = () => devicePixelRatio;
    // forma: jumătatea de lățime la înălțimea y (0 = sus, 1 = jos), pentru fiecare vas
    const SHAPES = {
      borcan: t => t < .08 ? .34 : .42,
      butoi: t => .34 + Math.sin(Math.PI * t) * .1,
      ulcior: t => { const sm = x => x * x * (3 - 2 * x); if (t < .14) return .13 + (.14 - t) * .25; if (t < .4) return .13 + sm((t - .14) / .26) * .3; return .43 - Math.pow((t - .4) / .6, 1.6) * .15; },
    };
    const geo = () => { const W0 = cv.width, H0 = cv.height, top = H0 * .14, bot = H0 * .97, cxm = W0 / 2, scale = Math.min(W0, (bot - top) * .95); return { W0, H0, top, bot, cxm, scale }; };
    function halfW(y, g) { const t = Math.max(0, Math.min(1, (y - g.top) / (g.bot - g.top))); return (SHAPES[shapeName] || SHAPES.borcan)(t) * g.scale; }
    function add(img, n, dia) {
      const g = geo(), max = S?.jar?.max || 120;
      for (let i = 0; i < n; i++) {
        const r = (16 + Math.min(14, Math.log2(1 + (dia || 1)) * 2)) * d();
        bodies.push({ x: g.cxm + (Math.random() - .5) * 40 * d(), y: g.top - 40 * d() - i * r * 2.2, vx: (Math.random() - .5) * 3, vy: 0, r, img, rot: Math.random() * 6, vr: (Math.random() - .5) * .2 });
      }
      while (bodies.length > max) bodies.shift();
      total += n; head();
    }
    function head() { root.querySelector('.ttl').textContent = S?.jar?.title || ''; root.querySelector('b').textContent = total ? `${fmt(total)} cadouri` : ''; }
    function vessel(g) {
      const steps = 40, pts = [];
      for (let i = 0; i <= steps; i++) { const y = g.top + (g.bot - g.top) * i / steps; pts.push([y, halfW(y, g)]); }
      cx.save(); cx.lineWidth = 5 * d();
      const path = () => { cx.beginPath(); pts.forEach(([y, w], i) => i ? cx.lineTo(g.cxm - w, y) : cx.moveTo(g.cxm - w, y)); for (let i = pts.length - 1; i >= 0; i--) cx.lineTo(g.cxm + pts[i][1], pts[i][0]); cx.closePath(); };
      path();

        cx.fillStyle = 'rgba(120,70,30,.28)'; cx.fill(); cx.strokeStyle = '#7a4a22'; cx.stroke();
        for (const t of [.12, .36, .64, .88]) { const y = g.top + (g.bot - g.top) * t, w = halfW(y, g); cx.beginPath(); cx.moveTo(g.cxm - w, y); cx.lineTo(g.cxm + w, y); cx.strokeStyle = '#3b3f45'; cx.lineWidth = 7 * d(); cx.stroke(); }
      } else if (shapeName === 'ulcior') {
        cx.fillStyle = 'rgba(190,95,50,.22)'; cx.fill(); cx.strokeStyle = '#c0663a'; cx.stroke();
        const y = g.top + (g.bot - g.top) * .5, w = halfW(y, g); cx.beginPath(); cx.moveTo(g.cxm - w * .9, y); cx.lineTo(g.cxm + w * .9, y); cx.setLineDash([10 * d(), 8 * d()]); cx.strokeStyle = 'rgba(255,220,180,.5)'; cx.lineWidth = 3 * d(); cx.stroke();
      } else {
        const gr = cx.createLinearGradient(g.cxm - g.scale * .42, 0, g.cxm + g.scale * .42, 0);
        gr.addColorStop(0, 'rgba(255,255,255,.16)'); gr.addColorStop(.25, 'rgba(255,255,255,.04)'); gr.addColorStop(.8, 'rgba(255,255,255,.08)'); gr.addColorStop(1, 'rgba(255,255,255,.2)');
        cx.fillStyle = gr; cx.fill(); cx.strokeStyle = 'rgba(255,255,255,.55)'; cx.stroke();
        cx.fillStyle = accent(); cx.fillRect(g.cxm - g.scale * .36, g.top - 16 * d(), g.scale * .72, 16 * d());
      }
      cx.restore();
    }
    function step() {
      const g = geo(), G = .45 * d();
      for (const b of bodies) { b.vy += G; b.vx *= .995; b.x += b.vx; b.y += b.vy; b.rot += b.vr; b.vr *= .98; }
      for (let it = 0; it < 3; it++) {
        for (let i = 0; i < bodies.length; i++) for (let j = i + 1; j < bodies.length; j++) {
          const a = bodies[i], b = bodies[j], dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy), min = a.r + b.r;
          if (dist > 0 && dist < min) { const p = (min - dist) / 2, nx = dx / dist, ny = dy / dist; a.x -= nx * p; a.y -= ny * p; b.x += nx * p; b.y += ny * p; const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny; if (rv < 0) { const k = rv * .5; a.vx += nx * k; a.vy += ny * k; b.vx -= nx * k; b.vy -= ny * k; } }
        }
        for (const b of bodies) {

      hello(e) { bodies = []; total = 0; (e.jar || []).forEach((x, i) => setTimeout(() => add(x.img, x.n || 1, x.d), i * 25)); },
      ev(e) {

        if (e.t === 'jar-reset' || e.t === 'reset') { bodies = []; total = 0; head(); }

    };
  });

  // ---- fântâna de like-uri: inimile țâșnesc de jos, cu poza celui care dă like din când în când
  widgets.fountain = (() => {

    function spawn(n, u) {
      const d = devicePixelRatio, max = S?.fountain?.max || 160;
      for (let i = 0; i < n && parts.length < max; i++) {
        const ang = -Math.PI / 2 + (Math.random() - .5) * .9, sp = (11 + Math.random() * 8) * d;
        parts.push({ x: cv.width / 2 + (Math.random() - .5) * 30 * d, y: cv.height + 10 * d, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, s: (26 + Math.random() * 20) * d, life: 0, hue: Math.random() * 40 - 20 });

    function base(side) { const d = devicePixelRatio; return side === 'left' ? { x: 70 * d, y: cv.height - 60 * d, dir: 1 } : { x: cv.width - 70 * d, y: cv.height - 60 * d, dir: -1 }; }

      dropEnd = Date.now() + d.left;
      if (!dropEl) { dropEl = document.createElement('div'); dropEl.className = 'card'; dropEl.style.cssText = 'padding:12px 16px;font-size:18px;font-weight:700;border-color:var(--accent)'; box.prepend(dropEl); }
      dropEl.dataset.txt = `🎁 Scrie ${S?.commands?.drop?.cmd || '!ia'} și primești ${fmt(d.amount)} ${S?.points?.currency || 'puncte'} (${d.claimed}/${d.max})`;
    }
    setInterval(() => { if (dropEl) { const l = Math.max(0, Math.ceil((dropEnd - Date.now()) / 1000)); dropEl.textContent = `${dropEl.dataset.txt} · ${l}s`; if (!l) { dropEl.remove(); dropEl = null; } } }, 250);
    return { draw: drawDrop, ev(e) { if (e.t === 'cmdinfo') add(e.text); } };
  });

  // ---- likeathon: cine dă cele mai multe like-uri
  widgets.topliker = (() => {
    root.innerHTML = '<div class="list card"><p class="ttl"></p><div class="rows"></div></div>';
    const draw = () => {
      root.querySelector('.ttl').textContent = S?.likeathon?.title || '';
      const n = S?.likeathon?.count || 8, list = (ST?.likers || []).slice(0, n);
      root.querySelector('.rows').innerHTML = list.length ? list.map((x, i) => `<div class="row"><span class="pos">${['👑', '🥈', '🥉'][i] || i + 1}</span>${avatar(x)}<span class="nm">${esc(x.name)}</span><span class="v num">❤️ ${fmt(x.likes)}</span></div>`).join('') : '<div class="empty">Dă like ca să apari aici!</div>';
    };
    return { draw };
  });

  // ----------------------------------------------------------- pornire
  const factory = widgets[W] || widgets.alerts;
  const w = factory();
  const redraw = () => { applyTheme(); w.draw?.(); };

  function onEvent(e) {
    if (e.t === 'hello') { S = previewS || e.settings; ST = e.state; POINTS = e.points || []; redraw(); w.hello?.(e); return; }
    if (e.t === 'settings') { S = previewS || e.settings; redraw(); return; }
    if (e.t === 'state') { ST = e.state; w.draw?.(); return; }
    if (e.t === 'points') { POINTS = e.list || []; w.draw?.(); return; }
    if (e.t === 'reset') { ST = { ...(ST || {}), likes: 0, diamonds: 0, gifts: 0, follows: 0, shares: 0, top: [], last: {} }; w.draw?.(); }
    if (e.t === 'revoked') { showErr('Linkul acestui overlay a fost schimbat. Ia linkul nou din Studio.'); src?.close(); return; }
    w.ev?.(e);
  }
  function showErr(m) { const el = document.getElementById('err'); el.textContent = m; el.classList.toggle('hide', !(P.get('debug') === '1' || window.top !== window)); }

  // (03.11.2026) în Studio, previzualizarea arată setările înainte de „Salvează”
  let previewS = null;
  addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data || !e.data.mrpPreview) return;
    previewS = e.data.mrpPreview; S = previewS; redraw();
  });
  let src = null;
  if (KEY && 'EventSource' in window) {
    src = new EventSource('/api/stream/live/' + encodeURIComponent(KEY));
    src.onmessage = m => { try { onEvent(JSON.parse(m.data)); } catch { /* */ } };
    src.onopen = () => document.getElementById('err').classList.add('hide');
    src.onerror = () => showErr('Overlay-ul nu se poate conecta. Verifică linkul din Studio.');
  }

  // ----------------------------------------------------------- date demo (previzualizare fără live)
  if (DEMO) {
    if (!KEY) { S = DEMO_SETTINGS(); ST = { likes: 0, diamonds: 0, gifts: 0, follows: 0, shares: 0, viewers: 128, top: [], timer: { running: true, left: 3600_000 } }; redraw(); }
    const names = ['Andrei_md', 'Cristina.22', 'Vlad', 'Mihaela', 'Dorin', 'Ionela', 'Sasha_77'];
    const gifts = [['Trandafir', 1], ['Gogoașă', 30], ['Confetti', 100], ['Leu', 29999]];
    let i = 0, bsc = [0, 0];
    const tickDemo = () => {
      if (!S) return;
      const u = { id: 'd' + (i % 7), name: names[i % 7], avatar: '' }, k = i++ % 6;
      ST = ST || {};
      if (k === 0 || k === 3) {
        const g = gifts[(i / 3 | 0) % gifts.length], c = 1 + (i % 3), tot = g[1] * c;
        ST.diamonds = (ST.diamonds || 0) + tot; ST.gifts = (ST.gifts || 0) + c;
        const top = new Map((ST.top || []).map(x => [x.id, x])); const t = top.get(u.id) || { ...u, diamonds: 0 }; t.diamonds += tot; top.set(u.id, t);
        ST.top = [...top.values()].sort((a, b) => b.diamonds - a.diamonds);
        onEvent({ t: 'gift', user: u, gift: g[0], img: '', count: c, diamonds: tot, alert: { kind: 'gift', text: `${u.name} a trimis ${c}× ${g[0]}!`, user: u.name, sound: 'coin', duration: 4, volume: 40 } });
        if (W === 'timer') onEvent({ t: 'timer', timer: { running: true, left: 3600_000 }, added: 30 });
        ST.last = { ...(ST.last || {}), gifter: { name: u.name, avatar: '', gift: g[0], img: '', count: c, at: Date.now() } };
        ST.feed = [{ name: u.name, avatar: '', gift: g[0], img: '', count: c, diamonds: tot, at: Date.now() }, ...(ST.feed || [])].slice(0, 12);
        if (!ST.topGift || tot > ST.topGift.diamonds) ST.topGift = { name: u.name, avatar: '', gift: g[0], img: '', count: c, diamonds: tot, at: Date.now() };
        if (c > 1 && (!ST.topStreak || c > ST.topStreak.count)) ST.topStreak = { name: u.name, avatar: '', gift: g[0], img: '', count: c, diamonds: tot, at: Date.now() };
        if (W === 'auction') { const b = new Map(((ST.auction || {}).top || []).map(x => [x.id, x])); const x = b.get(u.id) || { id: u.id, name: u.name, avatar: '', diamonds: 0 }; x.diamonds += tot; b.set(u.id, x); ST.auction = { running: true, left: 95000 - (i % 40) * 2000, top: [...b.values()].sort((p, q) => q.diamonds - p.diamonds), winner: null }; onEvent({ t: 'auction', auction: ST.auction }); }
        if (W === 'battle') { const tm = i % 2; bsc[tm] += tot; onEvent({ t: 'battle', battle: { running: true, left: 240000, scores: [...bsc], winner: null }, team: tm, pts: tot, user: u.name }); }
        if (W === 'actions') onEvent({ t: 'action', screen: Number(P.get('screen')) || 1, name: 'Exemplu', text: `Mersi, ${u.name}, pentru ${g[0]}! 🎉`, user: u, sound: 'magic', volume: 40, duration: 3, effect: 'confetti', position: 'center' });
      } else if (k === 1) { ST.follows = (ST.follows || 0) + 1; ST.last = { ...(ST.last || {}), follower: { name: u.name, avatar: '', at: Date.now() } }; onEvent({ t: 'follow', user: u, alert: { kind: 'follow', text: `${u.name} te urmărește acum!`, user: u.name, sound: 'pop', duration: 4, volume: 40 } }); }
      else if (k === 2) onEvent({ t: 'chat', user: u, text: ['Salut! 👋🔥', 'Bravo, live super 😂😂', '!tts ce faci azi? 🎉', 'De unde ești? ❤️'][i % 4] });
      else if (k === 4) { ST.likes = (ST.likes || 0) + 337; const L = new Map((ST.likers || []).map(x => [x.id, x])); const x = L.get(u.id) || { ...u, likes: 0 }; x.likes += 120 + i * 7; L.set(u.id, x); ST.likers = [...L.values()].sort((a, b) => b.likes - a.likes); onEvent({ t: 'like', user: u, count: 120 }); }
      if (W === 'cmdinfo' && k === 2) onEvent({ t: 'cmdinfo', text: `${u.name}: ${fmt(100 + i * 37)} puncte · nivelul ${1 + (i % 5)}` });
      else if (k === 5 && W === 'wheel') { const n = S.wheel.segments.length; onEvent({ t: 'wheel', idx: i % n, by: u.name, spinMs: 4000, holdMs: 2500, n }); }
      POINTS = (ST.top || []).map(x => ({ name: x.name, points: x.diamonds * 10 }));
      w.draw?.();
    };
    setTimeout(tickDemo, 500);
    setInterval(tickDemo, 2200);
  }
  function DEMO_SETTINGS() {
    return { theme: { style: P.get('theme') || 'neon', accent: '#ff8a1f', scale: 1 }, alerts: { volume: 40 }, chat: { max: 8, showGifts: true, hideCommands: true, fade: 0 },
      goals: [{ id: 'g1', type: 'likes', title: 'Obiectiv like-uri', target: 5000 }], top: { title: 'Top susținători', count: 5 }, counter: { title: 'Cadouri pe live' },
      wheel: { title: 'Roata norocului', segments: ['10 flotări', 'Shoutout', 'Cântă', 'Încă o tură', 'Glumă', 'Bonus'].map((label, i) => ({ label, color: ['#ff8a1f', '#3ddc84', '#4aa3ff', '#f25f8b', '#b57bff', '#ffd23f'][i] })) },
      timer: { title: 'Subathon' }, points: { title: 'Puncte', count: 5 }, fireworks: { on: true, maxIcons: 30 }, rotator: { lines: ['Dă follow!', 'Trimite un cadou și învârte roata!'], every: 4 },
      battle: { title: 'Bătălia echipelor', minutes: 5, teams: [{ name: 'Roșii', color: '#ff4d6a', command: '!rosu', gifts: 'Rose' }, { name: 'Albaștrii', color: '#4aa3ff', command: '!albastru', gifts: 'TikTok' }] },
      jar: { title: 'Borcanul cu cadouri', shape: P.get('shape') || 'borcan', max: 120, min: 1 }, fountain: { emoji: '❤️', perLikes: 5, avatars: true, max: 160 }, cannon: { side: 'both', min: 1, names: true },
      last: { follower: true, gifter: true, sharer: true, layout: 'column' }, emoji: { size: 64, max: 4 }, likeathon: { title: 'Cine dă cele mai multe like-uri', count: 8 },
      feed: { title: 'Ultimele cadouri', count: 6, min: 1 }, auction: { title: 'Licitație', item: 'Alegi tu jocul următor', minutes: 3, min: 1, snipe: 10, count: 5 } };
  }
})();
</script>
