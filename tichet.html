<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tichet — Moldova RP</title><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="dashboard.css"></head>
<body>
<header><a class="brand" href="index.html"><img src="assets/logo.png" alt="">MOLDOVA<span>RP</span></a><nav><a href="index.html">Acasă</a><a href="dashboard.html">Dashboard</a><a href="tichete.html">Tichete</a></nav><a class="logout" href="login.html" id="logout-link">Deconectare</a></header>
<main>
<p><a href="tichete.html" style="color:var(--muted);font-weight:700;font-size:13px">← Toate tichetele</a></p>

<section class="panel" id="ticket-box" style="margin-top:16px">
  <p class="muted">Se încarcă…</p>
</section>

<section class="panel" id="edit-box" hidden style="margin-top:16px">
  <div class="head"><h2>Editează tichetul</h2></div>
  <form id="edit-form">
    <div class="field"><label>Subiect</label><input id="e-subject" required maxlength="180"></div>
    <div class="field">
      <label>Categorie</label>
      <select id="e-category">
        <option value="general">General (privat, doar tu + staff)</option>
        <option value="bug">Bug / problemă tehnică (privat, doar tu + staff)</option>
        <option value="reclamatie">Reclamație jucător (public, vizibil pentru toți)</option>
        <option value="ban_appeal">Contestație sancțiune (privat, doar tu + staff)</option>
      </select>
    </div>
    <div class="field player-search-wrap" id="e-reported-wrap" hidden>
      <label>ID / nume jucător reclamat</label>
      <input id="e-reported-label" type="text" maxlength="120" placeholder="ex: 292 sau numele exact din joc" autocomplete="off">
      <small class="hint">Tichetul e public — orice utilizator îl poate citi, inclusiv jucătorul reclamat. Scrie ID-ul din joc (F10) sau numele exact — staff-ul identifică jucătorul din reclamație.</small>
    </div>
    <div class="field"><label>Descriere</label><textarea id="e-description" required></textarea></div>
    <div class="field"><label>Link dovadă (obligatoriu)</label><input id="e-evidence" type="url" required></div>
    <p class="formmsg" id="edit-msg" hidden></p>
    <div style="display:flex;gap:10px">
      <button type="submit" class="btn-primary">Salvează</button>
      <button type="button" class="btn-ghost" id="edit-cancel-btn">Anulează</button>
    </div>
  </form>
</section>
</main>
<script src="auth-client.js"></script>
<script>
const STATUS_LABEL = { open: 'DESCHIS', in_progress: 'ÎN LUCRU', resolved: 'REZOLVAT', closed: 'ÎNCHIS' };
const STATUS_PILL = { open: 'warn', in_progress: 'info', resolved: 'on', closed: 'off' };
const CATEGORY_LABEL = { general: 'General', bug: 'Bug / problemă tehnică', reclamatie: 'Reclamație jucător', ban_appeal: 'Contestație sancțiune' };

let currentTicket = null;

function render(t) {
  currentTicket = t;
  const box = document.getElementById('ticket-box');
  const closed = ['resolved', 'closed'].includes(t.status);
  const canEdit = t.is_own && !closed;
  const canReply = t.is_own && !closed;

  box.innerHTML = `
    <div class="head"><h2>${t.subject}</h2></div>
    <div class="ticket-meta">
      <span class="pill ${STATUS_PILL[t.status] || 'off'}">${STATUS_LABEL[t.status] || t.status}</span>
      <span>${CATEGORY_LABEL[t.category] || t.category}</span>
      <span>·</span>
      <span>${t.is_own ? 'tichetul tău' : `deschis de ${t.submitted_by}`}</span>
      <span>·</span>
      <span>${new Date(t.created_at).toLocaleString('ro-RO')}</span>
    </div>
    ${t.reported_display ? `<p><span class="reported-pill">🎯 Tichet despre: ${t.reported_display}</span></p>` : ''}
    <p class="ticket-desc">${t.description}</p>
    ${t.evidence_url ? `<p><a href="${t.evidence_url}" target="_blank" rel="noopener noreferrer" style="color:var(--orange);font-weight:800;font-size:13px">🔗 Dovadă atașată</a></p>` : ''}
    ${t.is_own ? `
      <div class="ticket-actions">
        ${canEdit ? '<button type="button" class="btn-ghost" id="edit-btn">Editează</button>' : ''}
        <button type="button" class="btn-ghost danger" id="delete-btn">Șterge</button>
      </div>
      ${!canEdit && !closed ? '' : (closed ? '<p class="muted" style="margin:-6px 0 14px">Tichetul e închis — nu mai poate fi editat, dar tot îl poți șterge.</p>' : '')}
    ` : ''}
    <div class="thread" id="thread"></div>
    ${canReply
      ? `<form id="reply-form">
          <div class="field wide"><label>Răspuns</label><textarea id="reply-message" required placeholder="Scrie un mesaj..."></textarea></div>
          <p class="formmsg" id="reply-msg" hidden></p>
          <button type="submit" class="btn-primary">Trimite</button>
        </form>`
      : (closed
          ? '<p class="muted">Acest tichet este închis — nu se mai pot adăuga răspunsuri.</p>'
          : '<p class="muted">Doar autorul tichetului și staff-ul pot răspunde aici.</p>')}
  `;

  document.getElementById('thread').innerHTML = t.replies.length
    ? t.replies.map(r => `
        <div class="msg ${['moderator','admin','co-fondator','owner'].includes(r.author_role) ? 'staff' : ''}">
          <b>${r.author}${['moderator','admin','co-fondator','owner'].includes(r.author_role) ? ' (staff)' : ''}</b>
          <span>${r.message}</span>
          <small>${new Date(r.created_at).toLocaleString('ro-RO')}</small>
        </div>`).join('')
    : '<p class="muted">Niciun răspuns încă.</p>';

  const form = document.getElementById('reply-form');
  if (form) form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('reply-msg');
    msg.hidden = true;
    const message = document.getElementById('reply-message').value.trim();
    if (!message) return;
    try {
      const res = await apiFetch(`/api/tickets/${t.id}/replies`, { method: 'POST', body: JSON.stringify({ message }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Trimiterea a eșuat.');
      await load();
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'formmsg error';
      msg.hidden = false;
    }
  });

  const editBtn = document.getElementById('edit-btn');
  if (editBtn) editBtn.addEventListener('click', () => openEdit(t));

  const delBtn = document.getElementById('delete-btn');
  if (delBtn) delBtn.addEventListener('click', async () => {
    if (!confirm('Ștergi definitiv acest tichet? Acțiunea nu poate fi anulată.')) return;
    try {
      const res = await apiFetch(`/api/tickets/${t.id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error();
      window.location.href = 'tichete.html';
    } catch {
      alert('Nu am putut șterge tichetul. Încearcă din nou.');
    }
  });
}

document.getElementById('e-category').addEventListener('change', (e) => {
  const isReclamatie = e.target.value === 'reclamatie';
  document.getElementById('e-reported-wrap').hidden = !isReclamatie;
  if (!isReclamatie) document.getElementById('e-reported-label').value = '';
});

function openEdit(t) {
  document.getElementById('e-subject').value = t.subject;
  document.getElementById('e-category').value = t.category;
  document.getElementById('e-description').value = t.description;
  document.getElementById('e-evidence').value = t.evidence_url || '';
  const isReclamatie = t.category === 'reclamatie';
  document.getElementById('e-reported-wrap').hidden = !isReclamatie;
  document.getElementById('e-reported-label').value = t.reported_player_label || t.reported_display || '';
  document.getElementById('edit-box').hidden = false;
  document.getElementById('edit-box').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

document.getElementById('edit-cancel-btn').addEventListener('click', () => {
  document.getElementById('edit-box').hidden = true;
});

document.getElementById('edit-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('edit-msg');
  msg.hidden = true;
  const category = document.getElementById('e-category').value;
  const reportedLabel = document.getElementById('e-reported-label').value.trim();
  if (category === 'reclamatie' && !reportedLabel) {
    msg.textContent = 'Scrie ID-ul sau numele jucătorului reclamat.';
    msg.className = 'formmsg error';
    msg.hidden = false;
    return;
  }
  const body = {
    subject: document.getElementById('e-subject').value.trim(),
    category,
    description: document.getElementById('e-description').value.trim(),
    evidence_url: document.getElementById('e-evidence').value.trim(),
    reported_player_label: reportedLabel
  };
  try {
    const res = await apiFetch(`/api/tickets/${currentTicket.id}`, { method: 'PUT', body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Salvarea a eșuat.');
    document.getElementById('edit-box').hidden = true;
    await load();
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'formmsg error';
    msg.hidden = false;
  }
});

async function load() {
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) { document.getElementById('ticket-box').innerHTML = '<p class="muted">Tichet negăsit.</p>'; return; }
  try {
    const res = await apiFetch(`/api/tickets/${id}`);
    if (!res.ok) throw new Error();
    render(await res.json());
  } catch {
    document.getElementById('ticket-box').innerHTML = '<p class="muted">Acest tichet nu există sau nu îl poți vedea.</p>';
  }
}

(async () => {
  if (!requireAuth()) return;
  load();
})();
wireLogout('#logout-link');
</script>
</body></html>
